<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Cover Page Generator - CAD Vector Engine</title>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --border-color: #d1d5db;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #1f2937;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .form-panel {
            width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .form-panel h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
        .form-panel p { font-size: 0.875rem; color: #6b7280; margin-bottom: 20px; line-height: 1.5; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #4b5563; }
        
        .input-group input, .input-group textarea {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .input-group textarea { resize: vertical; min-height: 80px; }
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-download {
            margin-top: 20px;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-download:hover { background-color: var(--primary-hover); }
        .btn-download:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: auto;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .preview-header {
            position: absolute;
            top: 20px;
            right: 40px;
            background: rgba(255,255,255,0.95);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            border: 1px solid var(--border-color);
        }

        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            flex-shrink: 0;
            transform-origin: top center;
        }

        @media (max-height: 900px) { .a4-page { transform: scale(0.85); margin-top: -40mm; } }
        @media (max-height: 750px) { .a4-page { transform: scale(0.7); margin-top: -80mm; } }
        @media (max-width: 900px) { 
            body { flex-direction: column; overflow: auto; } 
            .form-panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
            .preview-panel { padding: 20px; }
            .a4-page { transform: scale(0.5); margin-top: -140mm; margin-bottom: -140mm; }
        }

        .frame-border {
            position: absolute;
            top: 12mm;
            left: 12mm;
            width: 186mm;
            height: 273mm;
            border: 2px solid #000;
            pointer-events: none;
        }

        /* Preview styling (uses a monospace fallback for visual approximation) */
        .pdf-text {
            position: absolute;
            white-space: pre;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #000;
            line-height: 1;
        }
        .pdf-text::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #000;
            bottom: auto !important;
        }
        .text-title { font-size: 13.5mm !important; }
        .text-title::after { top: 12.5mm !important; } 
        .text-name { font-size: 6.75mm !important; }
        .text-name::after { top: 6.5mm !important; } 
        .text-detail { font-size: 5.4mm !important; }
        .text-detail::after { top: 5.5mm !important; }
    </style>
</head>
<body>

    <div class="form-panel">
        <div>
            <h2>Cover Page Designer</h2>
            <p>Fill in the details. Press <strong>Enter</strong> in the Title box for new lines.</p>
        </div>

        <form id="coverForm">
            <div class="input-group">
                <label for="title">Title of Experiment *</label>
                <textarea id="title" rows="4" placeholder="e.g., MECHANICS&#10;OF VIBRATIONS&#10;AND CONTROL" required></textarea>
            </div>
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="e.g., PERERA A.B.C.">
            </div>
            <div class="input-group">
                <label for="eNumber">E Number</label>
                <input type="text" id="eNumber" placeholder="e.g., E/20/123">
            </div>
            <div class="input-group">
                <label for="group">Group Number</label>
                <input type="text" id="group" placeholder="e.g., GROUP 04">
            </div>
            <div class="input-group">
                <label for="semester">Semester</label>
                <input type="text" id="semester" placeholder="e.g., SEMESTER 3">
            </div>
            <div class="input-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>

            <button type="button" class="btn-download" id="downloadBtn" onclick="generatePDF()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download PDF
            </button>
        </form>
    </div>

    <div class="preview-panel">
        <div class="preview-header">Live A4 Preview</div>
        <div class="a4-page" id="a4Page">
            <div class="frame-border"></div>
            <div id="previewContent"></div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        // =====================================================================
        // 1. ZERO-PADDING CAD FONT DICTIONARY (Grid: X 0-8, Y 0-10)
        // =====================================================================
        const cadFont = {
            'A': [[[0,10], [4,0], [8,10]], [[2,6], [6,6]]],
            'B': [[[0,0], [0,10], [6,10], [8,8], [8,2], [6,0], [0,0]], [[0,5], [6,5]]],
            'C': [[[8,2], [6,0], [2,0], [0,2], [0,8], [2,10], [6,10], [8,8]]],
            'D': [[[0,0], [0,10], [5,10], [8,7], [8,3], [5,0], [0,0]]],
            'E': [[[8,0], [0,0], [0,10], [8,10]], [[0,5], [6,5]]],
            'F': [[[0,0], [0,10], [8,10]], [[0,5], [6,5]]],
            'G': [[[8,2], [6,0], [2,0], [0,2], [0,8], [2,10], [6,10], [8,8], [8,5], [4,5]]],
            'H': [[[0,0], [0,10]], [[8,0], [8,10]], [[0,5], [8,5]]],
            'I': [[[4,0], [4,10]], [[2,0], [6,0]], [[2,10], [6,10]]],
            'J': [[[6,0], [6,8], [4,10], [2,10], [0,8]]],
            'K': [[[0,0], [0,10]], [[0,5], [8,0]], [[0,5], [8,10]]],
            'L': [[[0,0], [0,10], [8,10]]],
            'M': [[[0,10], [0,0], [4,5], [8,0], [8,10]]],
            'N': [[[0,10], [0,0], [8,10], [8,0]]],
            'O': [[[0,0], [8,0], [8,10], [0,10], [0,0]]],
            'P': [[[0,0], [0,10], [6,10], [8,8], [8,2], [6,0], [0,0]]],
            'Q': [[[0,0], [8,0], [8,10], [0,10], [0,0]], [[6,4], [8,0]]],
            'R': [[[0,0], [0,10], [6,10], [8,8], [8,5], [6,3], [0,0]], [[4,5], [8,0]]],
            'S': [[[8,2], [6,0], [2,0], [0,2], [0,5], [2,8], [6,10], [8,10], [8,8]]],
            'T': [[[0,0], [8,0]], [[4,0], [4,10]]],
            'U': [[[0,0], [0,8], [2,10], [6,10], [8,8], [8,0]]],
            'V': [[[0,0], [4,10], [8,0]]],
            'W': [[[0,0], [2,10], [4,5], [6,10], [8,0]]],
            'X': [[[0,0], [8,10]], [[8,0], [0,10]]],
            'Y': [[[0,0], [4,5], [4,10]], [[8,0], [4,5]]],
            'Z': [[[0,0], [8,0], [0,10], [8,10]]],
            '0': [[[0,0], [8,0], [8,10], [0,10], [0,0]], [[2,2], [6,8]]],
            '1': [[[2,0], [4,0], [4,10]], [[2,0], [6,0]]],
            '2': [[[0,8], [2,10], [6,10], [8,8], [8,2], [6,0], [0,0], [8,0]]],
            '3': [[[0,10], [8,10], [8,2], [6,0], [2,0], [0,2]], [[2,5], [8,5]]],
            '4': [[[6,0], [6,10]], [[0,4], [6,4], [8,0]]],
            '5': [[[8,0], [0,0], [0,5], [2,10], [6,10], [8,8]]],
            '6': [[[8,2], [6,0], [2,0], [0,2], [0,8], [2,10], [6,10], [8,8], [8,5], [0,5]]],
            '7': [[[0,0], [8,0], [4,10]]],
            '8': [[[4,0], [0,2], [0,8], [4,10], [8,8], [8,2], [4,0]], [[2,5], [6,5]]],
            '9': [[[0,8], [2,10], [6,10], [8,8], [8,2], [6,0], [2,0], [0,2], [0,5], [8,5]]],
            '-': [[[1,5], [7,5]]],
            '/': [[[2,10], [6,0]]],
            '.': [[[3.5,9], [4.5,9], [4.5,10], [3.5,10], [3.5,9]]],
            ' ': []
        };

        // =====================================================================
        // 2. THE DRAWING ENGINE
        // =====================================================================
        function drawCadText(doc, text, startX, startY, height, thickness, spacebarDist) {
            const letterSpacing = 1; // 1mm between letters
            const width = height * 0.8; // Exact mathematical aspect ratio
            const scale = height / 10; // Scales the 0-10 grid to physical mm
            
            doc.setLineWidth(thickness);
            doc.setDrawColor(0, 0, 0);
            
            let currentX = startX;
            text = text.toUpperCase();

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                
                if (char === ' ') {
                    currentX += spacebarDist;
                    continue;
                }

                if (cadFont[char]) {
                    let paths = cadFont[char];
                    paths.forEach(path => {
                        for (let j = 0; j < path.length - 1; j++) {
                            let point1 = path[j];
                            let point2 = path[j+1];
                            
                            // Map the 0-8 x 0-10 grid to physical mm coordinates
                            // Note: PDF Y-axis goes DOWN, so we invert the Y calculation
                            let x1 = currentX + (point1[0] * scale);
                            let y1 = startY - (point1[1] * scale); 
                            let x2 = currentX + (point2[0] * scale);
                            let y2 = startY - (point2[1] * scale); 
                            
                            doc.line(x1, y1, x2, y2);
                        }
                    });
                }
                
                // Advance the X coordinate for the next letter
                currentX += width + letterSpacing;
            }
            
            return currentX; // Returns the end position
        }

        // Helper to calculate exact ink width for layout centering
        function getCadTextWidth(text, height, spacebarDist = 3) {
            const letterSpacing = 1;
            const width = height * 0.8;
            let totalWidth = 0;
            const cleanText = text.toUpperCase();
            
            for (let i = 0; i < cleanText.length; i++) {
                if (cleanText[i] === ' ') {
                    totalWidth += spacebarDist;
                } else {
                    totalWidth += width + letterSpacing;
                }
            }
            
            // Remove the last letter's trailing letterSpacing to get exact bounding width
            const lastChar = cleanText.trim().slice(-1);
            if (lastChar && lastChar !== ' ') {
                totalWidth -= letterSpacing;
            }
            return Math.max(0, totalWidth);
        }

        // =====================================================================
        // 3. LAYOUT & GENERATION LOGIC
        // =====================================================================
        const inputs = {
            title: document.getElementById('title'),
            name: document.getElementById('name'),
            eNumber: document.getElementById('eNumber'),
            group: document.getElementById('group'),
            semester: document.getElementById('semester'),
            date: document.getElementById('date')
        };

        inputs.date.valueAsDate = new Date();
        Object.values(inputs).forEach(input => input.addEventListener('input', updatePreview));
        updatePreview();

        function getFormData() {
            return {
                title: inputs.title.value.toUpperCase() || 'TITLE OF EXPERIMENT',
                name: inputs.name.value.trim().toUpperCase(),
                eNumber: inputs.eNumber.value.trim().toUpperCase(),
                group: inputs.group.value.trim().toUpperCase(),
                semester: inputs.semester.value.trim().toUpperCase(),
                date: inputs.date.value ? new Date(inputs.date.value).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '/') : ''
            };
        }

        function calculateLayout(data) {
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });

            const items = [];
            // Height, Thickness, Spacebar Distance
            if (data.name) items.push({ id: 'name', text: data.name, height: 5, thickness: 0.4, spacebar: 3 });
            if (data.eNumber) items.push({ id: 'eNumber', text: data.eNumber, height: 4, thickness: 0.4, spacebar: 3 });
            if (data.group) items.push({ id: 'group', text: data.group, height: 4, thickness: 0.4, spacebar: 3 });
            if (data.semester) items.push({ id: 'semester', text: data.semester, height: 4, thickness: 0.4, spacebar: 3 });
            if (data.date) items.push({ id: 'date', text: data.date, height: 4, thickness: 0.4, spacebar: 3 });

            let maxWidth = 0;
            items.forEach(item => {
                item.width = getCadTextWidth(item.text, item.height, item.spacebar);
                if (item.width > maxWidth) maxWidth = item.width;
            });

            const rightBorderX = 198;
            const endX = rightBorderX - 10;
            const startX = endX - maxWidth;

            if (items.length > 0) {
                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    if (i === items.length - 1) {
                        item.underlineY = 270; // 15mm above bottom border
                    } else {
                        const nextItem = items[i + 1];
                        item.underlineY = (nextItem.baselineY - nextItem.height) - 3;
                    }
                    item.baselineY = item.underlineY - 1; // 1mm below text
                    item.topY = item.baselineY - item.height;
                    item.x = startX;
                }
            }

            const targetTopY = items.length > 0 ? items[0].topY : 250;

            // Title Block
            const rawTitleLines = data.title.split('\n').map(l => l.trim()).filter(l => l !== '');
            const titleLines = [];
            
            rawTitleLines.forEach(lineText => {
                const lineWidth = getCadTextWidth(lineText, 10, 5);
                titleLines.push({ text: lineText, width: lineWidth });
            });

            if (titleLines.length === 0) {
                titleLines.push({ text: 'TITLE OF EXPERIMENT', width: getCadTextWidth('TITLE OF EXPERIMENT', 10, 5) });
            }

            const numLines = titleLines.length;
            const titleBlockHeight = (numLines * 11) + ((numLines - 1) * 5);
            
            const midY = (12 + targetTopY) / 2;
            const titleBlockTopY = midY - (titleBlockHeight / 2);

            let currentY = titleBlockTopY;
            titleLines.forEach((line, index) => {
                line.topY = currentY;
                line.baselineY = currentY + 10;
                line.underlineY = currentY + 11;
                line.x = (210 - line.width) / 2; // Centered horizontally
                currentY = line.underlineY + 5;
            });

            return { items, titleLines };
        }

        function updatePreview() {
            const data = getFormData();
            const layout = calculateLayout(data);
            const container = document.getElementById('previewContent');
            container.innerHTML = '';

            layout.titleLines.forEach(line => {
                const el = document.createElement('div');
                el.className = 'pdf-text text-title';
                el.textContent = line.text;
                el.style.left = line.x + 'mm';
                el.style.top = line.topY + 'mm';
                container.appendChild(el);
            });

            layout.items.forEach(item => {
                const el = document.createElement('div');
                el.className = `pdf-text ${item.id === 'name' ? 'text-name' : 'text-detail'}`;
                el.textContent = item.text;
                el.style.left = item.x + 'mm';
                el.style.top = item.topY + 'mm';
                container.appendChild(el);
            });
        }

        async function generatePDF() {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerHTML = 'Generating...';

            setTimeout(() => {
                const data = getFormData();
                const layout = calculateLayout(data);
                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                doc.setDrawColor(0, 0, 0);
                doc.setTextColor(0, 0, 0);

                // Draw Border
                doc.setLineWidth(0.8);
                doc.rect(12, 12, 186, 273);

                // Draw Title using CAD Engine
                layout.titleLines.forEach(line => {
                    drawCadText(doc, line.text, line.x, line.baselineY, 10, 0.5, 5);
                    doc.setLineWidth(0.5);
                    doc.line(line.x, line.underlineY, line.x + line.width, line.underlineY);
                });

                // Draw Details using CAD Engine
                layout.items.forEach(item => {
                    drawCadText(doc, item.text, item.x, item.baselineY, item.height, 0.4, item.spacebar);
                    doc.setLineWidth(0.4);
                    doc.line(item.x, item.underlineY, item.x + item.width, item.underlineY);
                });

                const safeName = data.name.replace(/[^a-zA-Z0-9]/g, '_') || 'CoverPage';
                doc.save(`${safeName}_CoverPage.pdf`);

                btn.disabled = false;
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download PDF`;
            }, 100);
        }
    </script>
</body>
</html>
