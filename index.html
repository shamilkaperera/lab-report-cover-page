<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Report Cover Page Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Input Form -->
        <div class="form-section">
            <h1> Lab Report Cover Page Generator</h1>
            <p class="subtitle">Fill in the details below to generate your cover page</p>
            
            <form id="coverForm">
                <div class="form-group">
                    <label for="title">Title of Experiment *</label>
                    <input type="text" id="title" name="title" required placeholder="e.g., Mechanics of Vibrations">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required placeholder="Your name">
                    </div>

                    <div class="form-group">
                        <label for="regNumber">Registration Number *</label>
                        <input type="text" id="regNumber" name="regNumber" required placeholder="e.g., E/2020/123">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="groupNumber">Group Number *</label>
                        <input type="text" id="groupNumber" name="groupNumber" required placeholder="e.g., Group 5">
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester *</label>
                        <input type="text" id="semester" name="semester" required placeholder="e.g., Semester 1">
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">Date *</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="button-group">
                    <button type="button" onclick="generateCover()" class="btn btn-primary">Generate Cover Page</button>
                    <button type="button" onclick="printCover()" class="btn btn-secondary" id="printBtn" disabled>🖨️ Print / Save as PDF</button>
                </div>
            </form>
        </div>

        <!-- Preview Section -->
        <div class="preview-section" id="previewSection">
            <h2>Preview</h2>
            <div id="coverPage" class="cover-page">
                <div class="cover-content">
                    <div class="title-section">
                        <h1 id="previewTitle" class="experiment-title">TITLE OF EXPERIMENT</h1>
                    </div>
                    
                    <div class="details-section">
                        <p id="previewName">NAME</p>
                        <p id="previewRegNumber">REG. NO.</p>
                        <p id="previewGroupNumber">GROUP NO.</p>
                        <p id="previewSemester">SEMESTER</p>
                        <p id="previewDate">DATE</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
