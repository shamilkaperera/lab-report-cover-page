<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Page Designer</title>
    <link rel="stylesheet" href="style.css">
    <!-- html2pdf library for perfect A4 PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Left Side: Input Form -->
        <div class="form-panel">
            <div class="form-header">
                <h2>Cover Page Designer</h2>
                <p>Fill in the details to generate your A4 cover page.</p>
            </div>
            
            <form id="coverForm" onsubmit="return false;">
                <div class="input-group">
                    <label>Course Code</label>
                    <input type="text" id="courseCode" placeholder="e.g., ME3020">
                </div>

                <div class="input-group">
                    <label>Title of Experiment *</label>
                    <input type="text" id="title" required placeholder="e.g., INSTRUMENTATION">
                </div>

                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" required placeholder="e.g., PULLE D.S.C.F.">
                </div>

                <div class="input-group">
                    <label>Registration Number (E-Number) *</label>
                    <input type="text" id="regNumber" required placeholder="e.g., E/23/281">
                    <!-- NO VALIDATION BLOCKER HERE - ANYONE CAN TYPE ANYTHING -->
                </div>

                <div class="input-group">
                    <label>Group Number *</label>
                    <input type="text" id="groupNumber" required placeholder="e.g., GROUP B6">
                </div>

                <div class="input-group">
                    <label>Semester *</label>
                    <input type="text" id="semester" required placeholder="e.g., SEMESTER CS I">
                </div>

                <div class="input-group">
                    <label>Date *</label>
                    <input type="date" id="date" required>
                </div>

                <button type="button" class="btn-download" onclick="downloadPDF()">
                    📥 Download as PDF
                </button>
            </form>
        </div>

        <!-- Right Side: Live A4 Preview -->
        <div class="preview-panel">
            <div class="preview-header">
                <h3>Live Preview</h3>
            </div>
            <div class="preview-wrapper">
                <div id="coverPage" class="a4-page">
                    <!-- Outer Frame -->
                    <div class="outer-frame"></div>
                    
                    <div class="page-content">
                        <!-- Course Code (Top Center) -->
                        <div class="course-code-box">
                            <span id="outCourseCode"></span>
                        </div>

                        <!-- Title (Centered Vertically & Horizontally) -->
                        <div class="title-box">
                            <h1 id="outTitle">TITLE OF EXPERIMENT</h1>
                        </div>
                        
                        <!-- Details (Bottom Right) -->
                        <div class="details-box">
                            <p id="outName">NAME</p>
                            <p id="outRegNumber">REG. NO.</p>
                            <p id="outGroupNumber">GROUP NO.</p>
                            <p id="outSemester">SEMESTER</p>
                            <p id="outDate">DATE</p>
                        </div>
                    </div each>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
