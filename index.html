<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Cover Page Generator - Simplex Font</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --border-color: #d1d5db;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #1f2937;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .form-panel {
            width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .form-panel h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
        .form-panel p { font-size: 0.875rem; color: #6b7280; margin-bottom: 20px; line-height: 1.5; }

        .font-status {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .font-status.loading { background: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }
        .font-status.success { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .font-status.error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #4b5563; }
        
        .input-group input, .input-group textarea {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-download {
            margin-top: 20px;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-download:hover { background-color: var(--primary-hover); }
        .btn-download:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: auto;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .preview-header {
            position: absolute;
            top: 20px;
            right: 40px;
            background: rgba(255,255,255,0.95);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #6b7280;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
        }

        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            flex-shrink: 0;
            transform-origin: top center;
        }

        @media (max-height: 900px) { .a4-page { transform: scale(0.85); margin-top: -40mm; } }
        @media (max-height: 750px) { .a4-page { transform: scale(0.7); margin-top: -80mm; } }
        @media (max-width: 900px) { 
            body { flex-direction: column; overflow: auto; } 
            .form-panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
            .preview-panel { padding: 20px; }
            .a4-page { transform: scale(0.5); margin-top: -140mm; margin-bottom: -140mm; }
        }

        .frame-border {
            position: absolute;
            top: 12mm;
            left: 12mm;
            width: 186mm;
            height: 273mm;
            border: 2px solid #000;
            pointer-events: none;
        }

        .pdf-text {
            position: absolute;
            white-space: pre;
            font-family: 'Simplex' !important;
            color: #000;
            line-height: 1;
        }

        .pdf-text::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #000;
        }

        /* EXACT MEASUREMENTS */
        .text-name { font-size: 5mm !important; }
        .text-name::after { bottom: -1mm; } /* Underline 1mm below baseline */
        
        .text-detail { font-size: 4mm !important; }
        .text-detail::after { bottom: -1mm; } /* Underline 1mm below baseline */

        .text-title { font-size: 10mm !important; }
        .text-title::after { bottom: -1mm; } /* Underline 1mm below baseline */

    </style>
</head>
<body>

    <div class="form-panel">
        <div>
            <h2>Cover Page Designer</h2>
            <p>Fill in the details. Press <strong>Enter</strong> in the Title box to add as many lines as you need.</p>
        </div>

        <div id="fontStatus" class="font-status loading">
            <span>⏳</span> Loading Simplex font...
        </div>

        <form id="coverForm">
            <div class="input-group">
                <label for="title">Title of Experiment * (Press Enter for new line)</label>
                <textarea id="title" rows="4" placeholder="e.g., MECHANICS&#10;OF VIBRATIONS&#10;AND CONTROL&#10;SYSTEMS" required></textarea>
            </div>
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="e.g., PERERA A.B.C.">
            </div>
            <div class="input-group">
                <label for="eNumber">E Number</label>
                <input type="text" id="eNumber" placeholder="e.g., E/20/123">
            </div>
            <div class="input-group">
                <label for="group">Group Number</label>
                <input type="text" id="group" placeholder="e.g., GROUP 04">
            </div>
            <div class="input-group">
                <label for="semester">Semester</label>
                <input type="text" id="semester" placeholder="e.g., SEMESTER 3">
            </div>
            <div class="input-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>

            <button type="button" class="btn-download" id="downloadBtn" onclick="generatePDF()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download PDF
            </button>
        </form>
    </div>

    <div class="preview-panel">
        <div class="preview-header">Live A4 Preview</div>
        <div class="a4-page" id="a4Page">
            <div class="frame-border"></div>
            <div id="previewContent"></div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        let activeFontName = 'helvetica';
        let fontReady = false;

        function updateFontStatus(status, message) {
            const statusEl = document.getElementById('fontStatus');
            if(!statusEl) return;
            statusEl.className = `font-status ${status}`;
            const icons = { loading: '⏳', success: '✓', error: '✗' };
            statusEl.innerHTML = `<span>${icons[status]}</span> ${message}`;
        }

        function injectFontAsDataURI(base64) {
            const style = document.createElement('style');
            style.textContent = `
                @font-face {
                    font-family: 'Simplex';
                    src: url('data:font/truetype;base64,${base64}') format('truetype');
                    font-weight: normal;
                    font-style: normal;
                    font-display: swap;
                }
            `;
            document.head.appendChild(style);
            console.log('✓ Simplex font injected as data URI');
        }

        async function loadCustomFont() {
            try {
                console.log('Attempting to load Simplex.ttf...');
                
                const response = await fetch('./Simplex.ttf?v=' + Date.now(), { 
                    cache: 'no-store' 
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: File not found`);
                }
                
                const buffer = await response.arrayBuffer();
                const bytes = new Uint8Array(buffer);
                
                if (bytes.length < 1000) throw new Error('File too small');
                
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64 = btoa(binary);

                injectFontAsDataURI(base64);

                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                doc.addFileToVFS('Simplex.ttf', base64);
                doc.addFont('Simplex.ttf', 'Simplex', 'normal');
                
                activeFontName = 'Simplex';
                fontReady = true;
                
                updateFontStatus('success', `Simplex font loaded (${(bytes.length / 1024).toFixed(1)} KB)`);
                console.log('✓ Simplex font loaded');
                
                updatePreview();
                
            } catch (error) {
                console.error('Font loading error:', error);
                updateFontStatus('error', `Font not found. Using fallback. Check: ${error.message}`);
                fontReady = true;
            }
        }

        loadCustomFont();

        const inputs = {
            title: document.getElementById('title'),
            name: document.getElementById('name'),
            eNumber: document.getElementById('eNumber'),
            group: document.getElementById('group'),
            semester: document.getElementById('semester'),
            date: document.getElementById('date')
        };

        inputs.date.valueAsDate = new Date();

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updatePreview);
        });

        updatePreview();

        function getFormData() {
            return {
                title: inputs.title.value.toUpperCase() || 'TITLE OF EXPERIMENT',
                name: inputs.name.value.trim().toUpperCase(),
                eNumber: inputs.eNumber.value.trim().toUpperCase(),
                group: inputs.group.value.trim().toUpperCase(),
                semester: inputs.semester.value.trim().toUpperCase(),
                date: inputs.date.value ? new Date(inputs.date.value).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '/') : ''
            };
        }

        // Calculate width with exact spacing
        function getSpacedTextWidth(doc, text, fontSize, charSpaceMM, wordSpaceMM) {
            doc.setFontSize(fontSize);
            doc.setCharSpace(charSpaceMM);
            
            const words = text.split(' ');
            let totalWidth = 0;
            
            for (let i = 0; i < words.length; i++) {
                totalWidth += doc.getTextWidth(words[i]);
                if (i < words.length - 1) {
                    totalWidth += wordSpaceMM;
                }
            }
            
            doc.setCharSpace(0);
            return totalWidth;
        }

        // Draw text with exact spacing
        function drawSpacedText(doc, text, startX, baselineY, fontSize, charSpaceMM, wordSpaceMM) {
            doc.setFontSize(fontSize);
            doc.setCharSpace(charSpaceMM);
            
            const words = text.split(' ');
            let currentX = startX;
            
            for (let i = 0; i < words.length; i++) {
                doc.text(words[i], currentX, baselineY);
                currentX += doc.getTextWidth(words[i]);
                if (i < words.length - 1) {
                    currentX += wordSpaceMM;
                }
            }
            
            doc.setCharSpace(0);
            return currentX;
        }

        function calculateLayout(data) {
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });
            doc.setFont(activeFontName, 'normal');
            
            const ptPerMm = 2.83465;

            // 1. Filter valid bottom-right items
            const items = [];
            if (data.name) items.push({ id: 'name', text: data.name, height: 5, fontSize: 5 * ptPerMm, charSpace: 1, wordSpace: 3 });
            if (data.eNumber) items.push({ id: 'eNumber', text: data.eNumber, height: 4, fontSize: 4 * ptPerMm, charSpace: 1, wordSpace: 3 });
            if (data.group) items.push({ id: 'group', text: data.group, height: 4, fontSize: 4 * ptPerMm, charSpace: 1, wordSpace: 3 });
            if (data.semester) items.push({ id: 'semester', text: data.semester, height: 4, fontSize: 4 * ptPerMm, charSpace: 1, wordSpace: 3 });
            if (data.date) items.push({ id: 'date', text: data.date, height: 4, fontSize: 4 * ptPerMm, charSpace: 1, wordSpace: 3 });

            // 2. Find the LONGEST line
            let maxWidth = 0;
            items.forEach(item => {
                item.width = getSpacedTextWidth(doc, item.text, item.fontSize, item.charSpace, item.wordSpace);
                if (item.width > maxWidth) maxWidth = item.width;
            });

            const rightBorderX = 198;
            const endX = rightBorderX - 10;
            const startX = endX - maxWidth;

            // 3. Calculate Y-Axis (Bottom-Up)
            if (items.length > 0) {
                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    if (i === items.length - 1) {
                        item.underlineY = 270; // 15mm above bottom border
                    } else {
                        const nextItem = items[i + 1];
                        item.underlineY = (nextItem.baselineY - nextItem.height) - 3;
                    }
                    item.baselineY = item.underlineY - 1; // Underline 1mm below baseline
                    item.topY = item.baselineY - item.height;
                    item.x = startX;
                }
            }

            const targetTopY = items.length > 0 ? items[0].topY : 250;

            // 4. Title Block - EXACTLY 10mm HEIGHT
            const titleFontSize = 10 * ptPerMm; // 28.35pt = 10mm
            
            const rawTitleLines = data.title.split('\n').map(l => l.trim()).filter(l => l !== '');
            const titleLines = [];

            rawTitleLines.forEach(lineText => {
                const lineWidth = getSpacedTextWidth(doc, lineText, titleFontSize, 1, 5);
                titleLines.push({ text: lineText, width: lineWidth });
            });

            if (titleLines.length === 0) {
                const fallbackWidth = getSpacedTextWidth(doc, 'TITLE OF EXPERIMENT', titleFontSize, 1, 5);
                titleLines.push({ text: 'TITLE OF EXPERIMENT', width: fallbackWidth });
            }

            const numLines = titleLines.length;
            const titleBlockHeight = (numLines * 11) + ((numLines - 1) * 5);
            
            const midY = (12 + targetTopY) / 2;
            const titleBlockTopY = midY - (titleBlockHeight / 2);

            let currentY = titleBlockTopY;
            titleLines.forEach((line, index) => {
                line.topY = currentY;
                line.baselineY = currentY + 10; // 10mm text height
                line.underlineY = currentY + 11; // Underline 1mm below baseline
                line.x = (210 - line.width) / 2; // Centered horizontally
                
                currentY = line.underlineY + 5; // 5mm gap to next line
            });

            return { items, titleLines };
        }

        function updatePreview() {
            const data = getFormData();
            const layout = calculateLayout(data);
            const container = document.getElementById('previewContent');
            container.innerHTML = '';

            layout.titleLines.forEach(line => {
                const el = document.createElement('div');
                el.className = 'pdf-text text-title';
                el.textContent = line.text;
                el.style.left = line.x + 'mm';
                el.style.top = line.topY + 'mm';
                container.appendChild(el);
            });

            layout.items.forEach(item => {
                const el = document.createElement('div');
                el.className = `pdf-text ${item.id === 'name' ? 'text-name' : 'text-detail'}`;
                el.textContent = item.text;
                el.style.left = item.x + 'mm';
                el.style.top = item.topY + 'mm';
                container.appendChild(el);
            });
        }

        async function generatePDF() {
            if (!fontReady) {
                document.getElementById('downloadBtn').innerText = 'Loading Font...';
                while (!fontReady) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            }

            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerHTML = 'Generating...';

            setTimeout(() => {
                const data = getFormData();
                const layout = calculateLayout(data);
                
                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                doc.setFont(activeFontName, 'normal');
                doc.setTextColor(0, 0, 0);

                doc.setLineWidth(0.8);
                doc.rect(12, 12, 186, 273);

                // Title - 10mm height, underline 1mm below
                layout.titleLines.forEach(line => {
                    drawSpacedText(doc, line.text, line.x, line.baselineY, 10 * 2.83465, 1, 5);
                    doc.setLineWidth(0.5);
                    doc.line(line.x, line.underlineY, line.x + line.width, line.underlineY);
                });

                // Details - underline 1mm below each text
                layout.items.forEach(item => {
                    drawSpacedText(doc, item.text, item.x, item.baselineY, item.fontSize, 1, 3);
                    doc.setLineWidth(0.5);
                    doc.line(item.x, item.underlineY, item.x + item.width, item.underlineY);
                });

                const safeName = data.name.replace(/[^a-zA-Z0-9]/g, '_') || 'CoverPage';
                doc.save(`${safeName}_CoverPage.pdf`);

                btn.disabled = false;
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download PDF`;
            }, 100);
        }
    </script>
</body>
</html>
